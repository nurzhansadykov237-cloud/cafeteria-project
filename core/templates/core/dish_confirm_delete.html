
{% extends "core/base.html" %}

{% block title %}Удаление блюда — Столовая{% endblock %}

{% block content %}

<div class="card shadow-sm border-danger">
    <div class="card-body">

        <h1 class="text-danger mb-4">Удалить блюдо?</h1>

        <p class="fs-5">
            Вы действительно хотите удалить блюдо
            <strong>«{{ dish.name }}»</strong>?
        </p>

        <p class="text-muted">
            Это действие нельзя будет отменить.
        </p>

        <form method="post">
            {% csrf_token %}

            <button type="submit" class="btn btn-danger">
                Да, удалить
            </button>

            <a href="{% url 'core:dish_list' %}"
               class="btn btn-outline-secondary">
                Отмена
            </a>
        </form>

    </div>
</div>

{% endblock %}
