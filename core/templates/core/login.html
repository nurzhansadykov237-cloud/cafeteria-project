
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Вход</title>
</head>
<body>
    <h1>Вход в аккаунт</h1>

    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        {{ form.non_field_errors }}
        <button type="submit">Войти</button>
    </form>

    <a href="/">Вернуться на главную</a>
    <p>Нет аккаунта? <a href="/register/">Зарегистрироваться</a></p>
</body>
</html>
