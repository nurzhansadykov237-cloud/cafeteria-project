
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Информация о блюде</title>
</head>
<body>
    <h1>{{ dish.name }}</h1>

    <p>Категория: {{ dish.category }}</p>
    <p>Описание: {{ dish.description }}</p>
    <p>Цена: {{ dish.price }} тг.</p>

    {% if dish.is_available %}
        <p>Доступно</p>
    {% else %}
        <p>Недоступно</p>
    {% endif %}

    <a href="{% url 'dish_update' dish.pk %}">Редактировать</a>
    <br>
    <a href="{% url 'dish_delete' dish.pk %}">Удалить</a>
    <br>
    <a href="{% url 'dish_list' %}">Назад к списку</a>
</body>
</html>
